<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14261d"><link rel="manifest" href="./manifest.webmanifest"><title>RLM Camera</title><style>body{margin:0;background:#101c16;color:#e8f0e9;font:16px system-ui}main{max-width:640px;margin:auto;padding:16px}button,input,textarea{font:inherit}button{background:#355e45;color:white;border:1px solid #759981;border-radius:10px;padding:12px;margin:4px 4px 4px 0}input,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;background:#26372d;color:white;border:1px solid #68816e}section{background:#1c2c22;border-radius:14px;padding:14px;margin:12px 0}video,img{width:100%;max-height:50vh;object-fit:contain;background:#4c5a50;border-radius:8px}small{color:#afc0b3}label{display:block;margin:10px 0}</style><main><h2>RLM Camera <small>v0.2 · TESTING</small></h2><section><label>Projekt<input id="project" placeholder="Black Leaf 01"></label><button id="save">Spremi projekt</button><small id="status">Spremno za prvi test.</small></section><section><video id="video" autoplay muted playsinline hidden></video><img id="preview" alt="Snimljena fotografija" hidden><button id="start">Pokreni kameru</button><button id="snap">Snimi fotografiju</button><label>ili učitaj fotografiju<input id="upload" type="file" accept="image/*"></label></section><section><label>Sesija / checkpoint<input id="session" placeholder="Osmosis Gold — prvi sloj"></label><label>Bilješka (možeš diktirati tipkovnicom)<textarea id="note" rows="3"></textarea></label><button id="record">Snimi glasovnu bilješku</button><button id="stop" disabled>Zaustavi snimanje</button><small id="audioStatus"></small></section><section><button id="entry">Dodaj u timeline</button><button id="export">Izvezi JSON + medije pojedinačno</button><div id="timeline"></div><small>Ovo je početna funkcionalna osnova. ZIP, SVG kontura i automatski backup još nisu implementirani. Podaci su lokalni u pregledniku; prije brisanja podataka izvezi medije.</small></section></main><script>
const $=id=>document.getElementById(id),key='rlm-camera-v02',state=JSON.parse(localStorage.getItem(key)||'{"project":"","entries":[]}');let stream,rec,chunks=[],audio=null,photo=null;
$('project').value=state.project;function msg(s){$('status').textContent=s}function persist(){state.project=$('project').value;localStorage.setItem(key,JSON.stringify(state))}function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}function render(){$('timeline').replaceChildren();state.entries.slice().reverse().forEach(e=>{let p=document.createElement('p');p.textContent=e.time+' · '+e.session+' · '+e.note+' · '+(e.photo?'Foto':'')+' '+(e.audio?'Audio':'');$('timeline').append(p)})}render();$('save').onclick=()=>{persist();msg('Projekt spremljen lokalno.')};
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('video').hidden=false;$('preview').hidden=true;msg('Kamera aktivna.')}catch(e){msg('Kamera nije dostupna: '+e.message)}};
$('snap').onclick=()=>{const v=$('video');if(!v.videoWidth)return msg('Prvo pokreni kameru.');const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);photo=c.toDataURL('image/jpeg',.8);$('preview').src=photo;$('preview').hidden=false;msg('Fotografija snimljena.');};
$('upload').onchange=()=>{const f=$('upload').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo=r.result;$('preview').src=photo;$('preview').hidden=false;msg('Fotografija učitana.')};r.readAsDataURL(f)};
$('record').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const r=new FileReader();r.onload=()=>{audio=r.result;$('audioStatus').textContent='Audio spreman ('+Math.round(blob.size/1024)+' KB)'};r.readAsDataURL(blob);s.getTracks().forEach(t=>t.stop())};rec.start();$('record').disabled=true;$('stop').disabled=false;$('audioStatus').textContent='Snimanje...'}catch(e){$('audioStatus').textContent='Mikrofon: '+e.message}};
$('stop').onclick=()=>{if(rec&&rec.state==='recording')rec.stop();$('record').disabled=false;$('stop').disabled=true};
$('entry').onclick=()=>{try{state.entries.push({time:new Date().toISOString(),session:$('session').value,note:$('note').value,photo,audio});persist();render();msg('Checkpoint spremljen.');photo=null;audio=null;$('note').value='';$('audioStatus').textContent=''}catch(e){msg('Nije spremljeno: '+e.message+'. Lokalna memorija je možda puna.')}};
$('export').onclick=()=>{persist();const metadata={project:state.project,entries:state.entries.map(({photo,audio,...rest},i)=>({...rest,photo:photo?'photo_'+i+'.jpg':null,audio:audio?'audio_'+i+'.webm':null}))};dl('rlm_manifest.json',new Blob([JSON.stringify(metadata,null,2)],{type:'application/json'}));state.entries.forEach((e,i)=>{for(const [k,ext] of [['photo','jpg'],['audio','webm']])if(e[k]){const [head,b64]=e[k].split(',');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));dl(k+'_'+i+'.'+ext,new Blob([bytes],{type:head.match(/data:([^;]+)/)?.[1]||'application/octet-stream'}))}});msg('Izvoz pokrenut. Preglednik može tražiti dopuštenje za više preuzimanja.')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
